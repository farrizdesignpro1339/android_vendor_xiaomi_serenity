# udhcpd configuration file
# DHCP server configuration for udhcpd (BusyBox DHCP server)

# The start and end of the IP lease block
start           192.168.3.2
end             192.168.3.254

# The interface that udhcpd will use
interface       br-lan

# The maximum number of leases (default: 254)
max_leases      253

# The amount of time that an IP will be reserved (in seconds)
# after a DHCP decline message is received (default: 3600)
decline_time    3600

# The amount of time that an IP will be reserved (in seconds)
# after a DHCP release message is received (default: 3600)
conflict_time   3600

# How long an offered address is reserved (in seconds, default: 60)
offer_time      60

# If client asks for lease below this value, it will be rounded up
# to this value (in seconds, default: 60)
min_lease       60

# Disable lease file (leases won't persist after restart)
lease_file      /dev/null

# Disable pid file
pidfile /dev/null

# DNS servers (can have multiple)
opt     dns     192.168.3.1

# Default gateway
opt     router  192.168.3.1

# Subnet mask
opt     subnet  255.255.255.0

# Broadcast address
opt     broadcast       192.168.3.255

# Domain name
opt     domain  local

# Lease time in seconds (default: 864000 = 10 days)
option     lease   86400
